[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-review-agent-loop"
version = "0.1.0"
description = "Local Claude/Codex/Gemini coding PR review loop orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Wild Wind" }]
keywords = ["agents", "codex", "claude", "gemini", "github", "code-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "markdown-it-py>=3"]

[project.scripts]
agent-loop = "coding_review_agent_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_review_agent_loop"]
# Every file under the package ships, including the worker-budget pytest
# plugin in pytest_plugin/, which is loaded from its own directory through
# PYTHONPATH and is intentionally not a subpackage.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
