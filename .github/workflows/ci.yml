name: CI

# These declarations are intentionally literal.  The local driver uses them
# as readiness gates before it is allowed to suppress pull_request CI.
env:
  AGENT_LOOP_MANAGED_CI_V2: enabled
  AGENT_LOOP_MANAGED_CI_UNLABELED_RECOVERY_V1: enabled
  AGENT_LOOP_MANAGED_CI_VISIBLE_INTENT_V1: enabled
  AGENT_LOOP_MANAGED_CI_HOST_FOOTER_V1: enabled
  AGENT_LOOP_MANAGED_CI_TRUSTED_BASES_V1: enabled

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, unlabeled]
  workflow_dispatch:
    inputs:
      protocol_version:
        description: Managed-CI protocol version (leave empty for ordinary manual CI)
        required: false
        default: ''
      pr_number:
        description: Pull request being qualified
        required: false
        default: ''
      expected_head_sha:
        description: Exact pull request head SHA
        required: false
        default: ''
      managed_nonce:
        description: Fresh generation nonce from the managed-CI handoff record
        required: false
        default: ''

# Dispatch runs are deliberately correlated by nonce in the Actions UI and by
# PR/head in the concurrency key.  Ordinary PR and push runs use the workflow
# name, so they are never mislabeled as managed dispatches.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.managed_nonce != '' && format('managed-ci-v2 nonce={0}', inputs.managed_nonce) || github.workflow }}

jobs:
  ci:
    # The expression is fail-open.  Only a complete, trusted, same-repository
    # managed draft may suppress the suite.  `opened` is checked without the
    # label because the opening event can race the separate label write;
    # synchronize/reopened require the active label.  `unlabeled` always
    # returns to ordinary CI so label release is recoverable.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.protocol_version == '' && inputs.pr_number == '' &&
       inputs.expected_head_sha == '' && inputs.managed_nonce == '') ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'unlabeled' ||
        !(github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'agent-loop/managed-') &&
          github.event.pull_request.draft == true &&
          vars.AGENT_LOOP_MANAGED_ACTOR != '' &&
          github.event.pull_request.user.login == vars.AGENT_LOOP_MANAGED_ACTOR &&
          (github.event.action == 'opened' ||
           ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'agent-loop-managed'))))))
    permissions:
      contents: read
    uses: ./.github/workflows/managed-ci-ordinary.yml
    with:
      test_command: python -m pytest -n auto
      python_version: '3.12'
      shards: 3
      durations_file: tests/.test_durations

  managed:
    # The reusable workflow publishes the final-ci/exact-head status; the
    # literal is kept here because the driver's readiness gate reads this file.
    # All-empty manual dispatch is ordinary CI.  Every partial or non-empty
    # managed input reaches the reusable workflow and is rejected unless the
    # complete dispatch contract and the live PR/audit tuple validate.  The
    # permission envelope is the union of the callee's job permissions.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.protocol_version != '' || inputs.pr_number != '' ||
       inputs.expected_head_sha != '' || inputs.managed_nonce != '')
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/managed-ci.yml
    with:
      protocol_version: ${{ inputs.protocol_version }}
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      managed_nonce: ${{ inputs.managed_nonce }}
      test_command: python -m pytest -n auto
      python_version: '3.12'
      shards: 3
      durations_file: tests/.test_durations
